<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HamPathCalc</title>
        <link rel="icon" type="image/png" href="./img/logo.png">
        <link rel="stylesheet" href="./vendor/bootstrap/bootstrap.min.css">
        <link rel="stylesheet" href="./vendor/bootstrap-icons/bootstrap-icons.min.css">
        <link rel="stylesheet" href="./src/style.css"> 
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
    </head>
    <body>
        <nav class="navbar bg-body-secondary">
            <div class="container-fluid px-5 title-controls w-100">
                <a class="navbar-brand" href="">
                <img src="img/logo.png" alt="Logo" width="30" height="24" class="align-text-top">
                <div class="d-inline px-1">Hamiltonian Path Calculator</div>
                </a>
            </div>
        </nav>
        <nav class="navbar bg-success">
            <div class="container-fluid w-100">
                <ul class="nav button-controls">
                    <li class="nav-item px-2 col-12 col-md-auto col-lg-auto mb-2 mb-md-0">
                        <button id="add-node" type="button" class="btn btn-light" onclick="onNodeButtonClick()">
                            <i class="bi bi-node-plus"></i>
                            add a node
                        </button>
                    </li>
                    <li class="nav-item px-2 col-12 col-md-auto col-lg-auto mb-2 mb-md-0">
                        <button id="add-edge" type="button" class="btn btn-light" onclick="onEdgeButtonClick()">
                            <i class="bi bi-dash"></i>
                            add an edge
                        </button>
                    </li>
                    <li class="nav-item px-2 col-12 col-md-auto col-lg-auto mb-2 mb-md-0">
                        <button id="remove-item" type="button" class="btn btn-danger" onclick="onRemoveButtonClick()">
                            <i class="bi bi-trash3-fill"></i>
                            remove a node/an edge
                        </button>
                    </li>
                    <li class="nav-item px-2 col-12 col-md-auto col-lg-auto mb-2 mb-md-0">
                        <button id="clean-all" type="button" class="btn btn-danger" onclick="onCleanAllButtonClick()">
                            <i class="bi bi-trash3-fill"></i>
                            clean all
                        </button>
                    </li>
                </ul>
                <ul class="nav index-controls justify-content-center mt-md-2 mt-lg-0 col-12 col-md-auto col-lg-auto">
                    <li class="nav-item px-2">
                        <div class="form-check form-switch text-white py-2">
                            <input class="form-check-input" type="checkbox" id="fix-in-place">
                            <label class="form-check-label" for="fix-in-place">fix in place</label>
                        </div>
                    </li>
                    <li class="nav-item px-2">
                        <fieldset class="index-switch" aria-label="Indexing mode">
                            <legend class="visually-hidden">Indexing mode</legend>
                            <input type="radio" name="index-mode" id="zero-index" checked>
                            <label for="zero-index">0-index</label>
                            <input type="radio" name="index-mode" id="one-index">
                            <label for="one-index">1-index</label>
                        </fieldset>
                    </li>
                </ul>
                </div>
            </div>
        </nav>
        <main class="container-fluid app-layout py-3">
            <div class="row g-3 h-100">
                <section class="col-12 col-md-2 h-100">
                    <div id="top-panel" class="bg-success rounded-3 h-100">
                        <p class="p-2">TBA Hamiltonian Path Methods</p>
                    </div>
                </section>
                <section class="col-12 col-md-8 h-100">
                    <div id="graph-area" class="rounded-3 p-3 h-100">
                    </div>
                </section>
                <section class="col-12 col-md-2 h-100">
                    <textarea id="graph-txt" class="form-control mb-2 h-75" aria-label="Graph as text" placeholder="Enter graph data here in this format:&#10;N - number of nodes&#10;u1 v1 - edge from node u1 to node v1&#10;u2 v2 - edge from node u2 to node v2&#10;..."></textarea>
                    <div class="empty-space"></div>
                    <div class="button-group justify-content-between align-items-center d-flex mb-2 mb-md-0">
                        <button id="generate-button" class="btn btn-danger col-12 col-md-6 mb-1 mb-md-0 h-100" onclick="onGenerateButtonClick()">Generate a graph</button>
                        <button id="calc-button" class="btn btn-primary col-12 col-md-6 ms-md-1 h-100" onclick="onCalcButtonClick()">Find a path</button>
                    </div>
                    <div class="empty-space"></div>
                </section>
            </div>
        </main>


        <script src="./vendor/bootstrap/bootstrap.bundle.min.js"></script>
        <script src="./src/script.js"></script>
        <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
